<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOHAS Park MTR Live Departures | 康城站實時班次</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-item: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #475569;
      --purple: #9333ea;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
    }

    body.light-mode {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-item: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --purple: #7e22ce;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px;
      transition: background-color 0.2s ease;
    }

    .dashboard {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    .line-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--purple);
      text-transform: uppercase;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--purple);
    }

    .station-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .station-title span {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    .clock-box {
      text-align: right;
      font-family: monospace;
    }

    .clock-time {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .clock-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0;
      font-size: 0.8rem;
    }

    .btn {
      background: var(--card-item);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .status-banner {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 14px;
      display: none;
    }

    .status-banner.warning {
      display: block;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--amber);
      color: var(--amber);
    }

    .train-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .train-item {
      background: var(--card-item);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .train-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .plat {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(147, 51, 234, 0.15);
      border: 1px solid var(--purple);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--purple);
      font-weight: bold;
      font-size: 0.8rem;
    }

    .dest-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .dest-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .eta-box {
      text-align: right;
    }

    .eta-val {
      font-size: 1.4rem;
      font-weight: bold;
      font-family: monospace;
      color: var(--purple);
    }

    .eta-now {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--amber);
      padding: 3px 8px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--amber);
      border-radius: 12px;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.4; }
    }

    .footer {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Header -->
    <div class="header">
      <div>
        <div class="line-tag">
          <span class="dot"></span>
          <span>Tseung Kwan O Line (將軍澳綫)</span>
        </div>
        <div class="station-title">LOHAS Park <span>康城</span></div>
      </div>
      <div class="clock-box">
        <div class="clock-time" id="liveClock">--:--:--</div>
        <div class="clock-sub">Refresh in <span id="timer">30</span>s</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <span>Departures (往港島/調景嶺)</span>
      <div style="display: flex; gap: 6px;">
        <button class="btn" id="themeToggle" onclick="toggleTheme()">☀️ Light Mode</button>
        <button class="btn" onclick="loadDepartures()">🔄 Refresh</button>
      </div>
    </div>

    <div id="noticeBanner" class="status-banner"></div>

    <!-- Departure List -->
    <div class="train-list" id="trainList">
      <div style="text-align: center; padding: 20px; color: var(--text-muted);">
        Loading live departures...
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span id="sourceLabel">Source: MTR Open Data</span>
      <span id="updatedTime">Updated: --</span>
    </div>
  </div>

  <script>
    const STATIONS = {
      'NOP': { en: 'North Point', zh: '北角' },
      'TIK': { en: 'Tiu Keng Leng', zh: '調景嶺' },
      'POA': { en: 'Po Lam', zh: '寶琳' },
      'TKO': { en: 'Tseung Kwan O', zh: '將軍澳' }
    };

    let countdown = 30;

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      document.getElementById('themeToggle').textContent = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString('en-HK', { hour12: false });
    }

    async function loadDepartures() {
      const listEl = document.getElementById('trainList');
      const noticeEl = document.getElementById('noticeBanner');
      const updatedEl = document.getElementById('updatedTime');
      countdown = 30;

      const url = 'https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP';

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('API offline');
        const json = await res.json();

        if (json.status === 0 || !json.data || !json.data['TKL-LHP']) {
          renderList([]);
          return;
        }

        noticeEl.className = 'status-banner';
        noticeEl.style.display = 'none';
        renderList(json.data['TKL-LHP'].UP || []);
      } catch (err) {
        // Fallback for file:/// security lock or offline mode
        noticeEl.className = 'status-banner warning';
        noticeEl.innerHTML = '⚠️ Note: Browser blocked direct connection (common with local files). Showing simulated timetable:';
        renderDemoData();
      }

      updatedEl.textContent = 'Updated: ' + new Date().toLocaleTimeString('en-HK', { hour12: false });
    }

    function renderList(trains) {
      const listEl = document.getElementById('trainList');
      if (!trains || trains.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; padding: 24px; color: var(--text-muted);">No upcoming departures reported at this time.</div>';
        return;
      }

      listEl.innerHTML = trains.map(t => {
        const dest = STATIONS[t.dest] || { en: t.dest, zh: '' };
        const isDirect = t.dest === 'NOP';
        const mins = parseInt(t.ttnt, 10);
        const etaHtml = (mins <= 1 || t.ttnt === '0') 
          ? `<span class="eta-now">Arriving / 即將抵達</span>` 
          : `<span class="eta-val">${t.ttnt}<span style="font-size:0.75rem; color: var(--text-muted);"> min</span></span>`;

        return `
          <div class="train-item">
            <div class="train-info">
              <div class="plat">P${t.plat || '1'}</div>
              <div>
                <div class="dest-name">${dest.en} <span style="font-size:0.85rem; color:var(--text-muted);">${dest.zh}</span></div>
                <div class="dest-sub">
                  <span style="color:${isDirect ? 'var(--green)' : 'var(--amber)'};">● ${isDirect ? 'Direct' : 'Shuttle (Transfer at TIK)'}</span>
                  • ${t.time ? t.time.split(' ')[1] : ''}
                </div>
              </div>
            </div>
            <div class="eta-box">${etaHtml}</div>
          </div>
        `;
      }).join('');
    }

    function renderDemoData() {
      const now = new Date();
      renderList([
        { plat: '1', dest: 'NOP', ttnt: '3', time: new Date(now.getTime() + 3*60000).toTimeString().slice(0,8) },
        { plat: '1', dest: 'TIK', ttnt: '10', time: new Date(now.getTime() + 10*60000).toTimeString().slice(0,8) },
        { plat: '1', dest: 'NOP', ttnt: '17', time: new Date(now.getTime() + 17*60000).toTimeString().slice(0,8) }
      ]);
    }

    // Interval timers
    setInterval(updateClock, 1000);
    setInterval(() => {
      countdown = countdown > 1 ? countdown - 1 : 30;
      document.getElementById('timer').textContent = countdown;
      if (countdown === 30) loadDepartures();
    }, 1000);

    updateClock();
    loadDepartures();
  </script>
</body>
</html>
