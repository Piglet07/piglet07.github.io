<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOHAS Park MTR Live Departures | 康城站實時班次</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2e;
      --card-inner: #1b243b;
      --border-color: #273553;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --tkl-purple: #704285;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .dashboard-container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    .line-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #d8b4fe;
      margin-bottom: 4px;
    }

    .line-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--tkl-purple);
      box-shadow: 0 0 8px var(--tkl-purple);
    }

    .station-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .station-name span {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-left: 6px;
      font-weight: normal;
    }

    .clock-section {
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .clock-time {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .clock-refresh {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 12px 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .btn-refresh {
      background: var(--card-inner);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-refresh:hover {
      background: var(--border-color);
    }

    .btn-refresh:active {
      transform: scale(0.97);
    }

    .departure-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .train-card {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s ease;
    }

    .train-card:hover {
      border-color: #4b5563;
    }

    .train-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .plat-badge {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(112, 66, 133, 0.25);
      border: 1px solid var(--tkl-purple);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e9d5ff;
    }

    .plat-title {
      font-size: 0.6rem;
      text-transform: uppercase;
      opacity: 0.8;
      line-height: 1;
    }

    .plat-num {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .dest-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .dest-title span {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-left: 6px;
    }

    .dest-meta {
      font-size: 0.75rem;
      margin-top: 2px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
