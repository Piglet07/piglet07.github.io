<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOHAS Park MTR Live | 康城站實時班次</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #161f30;
      --card-item: #212d45;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --tkl-purple: #9333ea;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 14px;
    }

    .dashboard {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    .line-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #c084fc;
      text-transform: uppercase;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--tkl-purple);
      box-shadow: 0 0 8px var(--tkl-purple);
    }

    .station-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .station-title span {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    .clock-box {
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .clock-time {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .clock-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0 10px 0;
      font-size: 0.8rem;
    }

    .btn {
      background: var(--card-item);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .train-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .train-item {
      background: var(--card-item);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .train-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .plat {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(147, 51, 234, 0.2);
      border: 1px solid var(--tkl-purple);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e9d5ff;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .dest-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .dest-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .eta-box {
      text-align: right;
    }

    .eta-val {
      font-size: 1.4rem;
      font-weight: bold;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #d8b4fe;
    }

    .eta-now {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--amber);
      padding: 4px 8px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--amber);
      border-radius: 12px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      50% { opacity: 0.5; }
    }

    .status-msg {
      text-align: center;
      padding: 24px 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Header -->
    <div class="header">
      <div>
        <div class="line-tag">
          <span class="dot"></span>
          <span>Tseung Kwan O Line (將軍澳綫)</span>
        </div>
        <div class="station-title">LOHAS Park <span>康城</span></div>
      </div>
      <div class="clock-box">
        <div class="clock-time" id="liveClock">--:--:--</div>
        <div class="clock-sub">Refresh in <span id="timer">30</span>s</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <span>Platform Departures (往港島 / 調景嶺)</span>
      <button class="btn" onclick="fetchDepartures()">🔄 Refresh</button>
    </div>

    <!-- Departure List -->
    <div class="train-list" id="trainList">
      <div class="status-msg">Connecting to MTR live data...</div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>Source: MTR Open Data</span>
      <span id="updatedTime">Updated: --</span>
    </div>
  </div>

  <script>
    const STATIONS = {
      'NOP': { en: 'North Point', zh: '北角' },
      'TIK': { en: 'Tiu Keng Leng', zh: '調景嶺' },
      'POA': { en: 'Po Lam', zh: '寶琳' },
      'TKO': { en: 'Tseung Kwan O', zh: '將軍澳' }
    };

    let countdown = 30;

    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString('en-HK', { hour12: false });
    }

    async function fetchDepartures() {
      const listEl = document.getElementById('trainList');
      const updatedEl = document.getElementById('updatedTime');
      countdown = 30;

      const rawUrl = 'https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP';
      
      // Endpoints to try sequentially in case of CORS or proxy limits
      const endpoints = [
        `https://corsproxy.io/?url=${encodeURIComponent(rawUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`,
        rawUrl
      ];

      let data = null;

      for (const endpoint of endpoints) {
        try {
          const res = await fetch(endpoint);
          if (!res.ok) continue;
          const text = await res.text();
          data = JSON.parse(text);
          if (data && data.status !== undefined) break; // Valid JSON received
        } catch (e) {
          // Fall through to next endpoint
        }
      }

      if (!data || data.status === 0 || !data.data || !data.data['TKL-LHP']) {
        listEl.innerHTML = '<div class="status-msg">No train service reported or outside operating hours.</div>';
        return;
      }

      const departures = data.data['TKL-LHP'].UP || [];

      if (departures.length === 0) {
        listEl.innerHTML = '<div class="status-msg">No upcoming departures at this moment.</div>';
        return;
      }

      listEl.innerHTML = departures.map(t => {
        const dest = STATIONS[t.dest] || { en: t.dest, zh: '' };
        const isDirect = t.dest === 'NOP';
        const mins = parseInt(t.ttnt, 10);
        const etaHtml = (mins <= 1 || t.ttnt === '0')
          ? `<span class="eta-now">Arriving / 即將抵達</span>`
          : `<span class="eta-val">${t.ttnt}<span style="font-size:0.75rem; color: var(--text-muted);"> min</span></span>`;

        return `
          <div class="train-item">
            <div class="train-info">
              <div class="plat">P${t.plat || '1'}</div>
              <div>
                <div class="dest-name">${dest.en} <span style="font-size:0.85rem; color:var(--text-muted);">${dest.zh}</span></div>
                <div class="dest-sub">
                  <span style="color:${isDirect ? 'var(--green)' : 'var(--amber)'};">● ${isDirect ? 'Direct (直達港島)' : 'Shuttle (需於調景嶺轉車)'}</span>
                  • ${t.time ? t.time.split(' ')[1] : ''}
                </div>
              </div>
            </div>
            <div class="eta-box">${etaHtml}</div>
          </div>
        `;
      }).join('');

      updatedEl.textContent = 'Updated: ' + new Date().toLocaleTimeString('en-HK', { hour12: false });
    }

    // Interval timers
    setInterval(updateClock, 1000);
    setInterval(() => {
      countdown = countdown > 1 ? countdown - 1 : 30;
      document.getElementById('timer').textContent = countdown;
      if (countdown === 30) fetchDepartures();
    }, 1000);

    updateClock();
    fetchDepartures();
  </script>
</body>
</html>
